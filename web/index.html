<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>knot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 책상 위 오브제가 주인공. 노트북 화면은 옆에 작게 놓인 보조 화면.
   호박색은 LED가 켜질 때와 이어진 결정에만 쓴다. 장식으로 쓰지 않는다. */
:root{color-scheme:dark light;
--page:light-dark(#e9e7e2,#151412);--stage:light-dark(#f6f5f1,#1e1d1a);--floor:light-dark(#dedbd3,#2a2824);
--ink:light-dark(#1a1916,#ebe7de);--mute:light-dark(#6e6a61,#8c877c);--line:light-dark(#d3cfc6,#33312c);
--amber:#f2a114;--glass:light-dark(#ffffff,#22211e);--bezel:light-dark(#2a2926,#0d0d0c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
header{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:28px max(4vw,16px) 18px}
h1{margin:0;font-weight:600;font-size:56px;line-height:.9;letter-spacing:-.04em}
header p{margin:0 0 4px;color:var(--mute)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;margin:0 max(4vw,16px);border-radius:28px;overflow:hidden;background:var(--stage)}
.view{position:relative;min-height:min(72vh,720px);background:radial-gradient(ellipse 60% 38% at 46% 82%,var(--floor),transparent 70%)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.view canvas:active{cursor:grabbing}
.state{position:absolute;left:28px;top:24px;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.state i{width:22px;height:4px;border-radius:2px;background:var(--line);transition:background .5s,box-shadow .5s}
.state.on i{background:var(--amber);box-shadow:0 0 14px var(--amber)}
.state.on{color:var(--ink)}
.hint{position:absolute;left:28px;bottom:22px;color:var(--mute);font-size:13px}
.side{display:flex;align-items:center;padding:24px 24px 24px 0}
.laptop{width:100%;background:var(--bezel);border-radius:14px;padding:8px}
.scr{display:flex;flex-direction:column;height:430px;border-radius:7px;background:var(--glass);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.pill{padding:2px 10px;border-radius:12px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.open{border-color:var(--amber);color:var(--amber)}
.pill.closed{background:var(--ink);color:var(--glass);border-color:var(--ink)}
.bar .name{font-weight:600}
.sub{padding:6px 14px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);min-height:29px}
.body{flex:1;position:relative;overflow:auto;padding:14px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px}
.msg{max-width:88%;margin:0 0 10px;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5}
.me{margin-left:auto;background:var(--page)}
.ai{border:1px solid var(--line)}
.typing{display:inline-flex;gap:4px}.typing b{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:t 1s infinite}.typing b:nth-child(2){animation-delay:.15s}.typing b:nth-child(3){animation-delay:.3s}
@keyframes t{50%{opacity:.25}}
.flow{list-style:none;margin:0;padding:4px 0 4px 6px;position:relative}
.flow::before{content:"";position:absolute;left:10px;top:12px;bottom:26px;width:2px;background:var(--amber)}
.flow li{position:relative;padding:0 0 12px 22px;font-size:13px;line-height:1.4}
.flow li::before{content:"";position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.flow li.d{margin-left:24px;color:var(--mute)}
.flow li.d::before{background:var(--glass);border:1.5px solid var(--mute);width:8px;height:8px}
.flow li.d::after{content:"";position:absolute;left:-19px;top:10px;width:19px;height:0;border-top:1.5px dashed var(--mute)}
.flow li.d b{font-weight:500}
.flow small{display:block;color:var(--mute);font-size:12px}
.map{position:absolute;inset:0;padding:6px 8px 26px}
.map svg{width:100%;height:100%}
.legend{margin:6px 0 0 6px;font-size:11px;color:var(--mute);display:flex;gap:12px}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle;background:var(--amber)}
.legend span.d::before{background:var(--mute)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:18px max(4vw,16px) 6px}
button{font:500 15px "IBM Plex Sans KR",sans-serif;min-height:46px;padding:0 20px;border-radius:23px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
button:hover:not(:disabled){border-color:var(--mute)}
button.go{background:var(--ink);color:var(--page);border-color:var(--ink)}
button:disabled{color:var(--mute);opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#bReset{margin-left:auto;border-color:transparent;color:var(--mute)}
.note{padding:4px max(4vw,16px) 28px;color:var(--mute);font-size:12px}
@media(max-width:960px){.stage{grid-template-columns:minmax(0,1fr)}.side{padding:0 16px 16px}.view{min-height:56vh}.scr{height:360px}h1{font-size:44px}#bReset{margin-left:0}}
@media(prefers-reduced-motion:reduce){.typing b{animation:none}.state i{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header><h1>knot</h1><p>줄을 묶어 AI 프로젝트를 끝내는 디바이스</p></header>
<main class="stage">
  <div class="view" id="view"><canvas id="c" aria-label="knot 디바이스 3D 모델"></canvas><div class="state" id="led"><i></i><span>대기 중</span></div><div class="hint">드래그해서 돌려보기, 스크롤해서 확대</div></div>
  <div class="side"><div class="laptop"><div class="scr">
    <div class="bar"><span class="pill" id="pill">카드 없음</span><span class="name" id="pname"></span></div>
    <div class="sub" id="st">카드를 꽂으면 프로젝트가 시작돼요</div>
    <div class="body" id="body"><div class="empty">슬롯에 카드를 꽂아 주세요</div></div>
  </div></div></div>
</main>
<nav class="controls" aria-label="디바이스 동작">
  <button id="bInsert" class="go">카드 꽂기</button>
  <button id="bTalk">말 걸기</button>
  <button id="bSlide">슬라이더로 빼기</button>
  <button id="bKnot">줄 묶기</button>
  <button id="bHang">뚫린 카드 걸기</button>
  <button id="bReset">처음으로</button>
</nav>
<p class="note">채팅과 브랜치맵은 이 TUI 과제의 진행 흐름을 예시로 넣었어요.</p>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
{
const $=id=>document.getElementById(id);
const view=$('view'),canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.55;
const cam=new THREE.PerspectiveCamera(32,1,0.01,10);
cam.position.set(0.44,0.25,0.38);
const ctl=new OrbitControls(cam,canvas);ctl.target.set(0.03,0.095,0);ctl.enableDamping=true;ctl.minDistance=0.25;ctl.maxDistance=1.6;ctl.maxPolarAngle=Math.PI*0.49;
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(0.1,0.6,0.9);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-0.4,right:0.4,top:0.4,bottom:-0.4,near:0.1,far:3});key.shadow.radius=3;key.shadow.bias=-0.0004;
scene.add(key);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,0.45));const rim=new THREE.DirectionalLight(0xfff3e0,1.6);rim.position.set(-0.5,0.45,-0.7);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4,4),new THREE.ShadowMaterial({opacity:0.32}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const U={uTime:{value:0},uOn:{value:0}};
const noise=`
float h3(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}`;
const bodyMat=new THREE.MeshPhysicalMaterial({color:0x0b0b0c,roughness:0.32,clearcoat:0.25,clearcoatRoughness:0.08});
bodyMat.onBeforeCompile=s=>{
  Object.assign(s.uniforms,U);
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 ledMask;varying float vMask;varying vec3 vObj;')
   .replace('#include <begin_vertex>','#include <begin_vertex>\nvMask=ledMask.r;vObj=position;');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform float uTime;uniform float uOn;varying float vMask;varying vec3 vObj;'+noise)
   .replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.22,0.17,0.09),vMask);')
   .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
   float t=uTime;float n=vn(vObj*9.0+vec3(t*0.35,-t*0.22,t*0.3));
   float sh=mix(0.35,1.0,smoothstep(0.3,0.7,n))*(0.85+0.15*sin(t*0.8));
   totalEmissiveRadiance+=vec3(1.0,0.45,0.0)*vMask*uOn*sh*1.8;`);
};
const M={
  cord:new THREE.MeshStandardMaterial({color:0x121212,roughness:0.8}),
  card:new THREE.MeshStandardMaterial({color:0x2c2c2e,roughness:0.6,transparent:true}),
  rim:new THREE.MeshStandardMaterial({color:0x8a8a8a,roughness:0.5,transparent:true}),
  pin:new THREE.MeshStandardMaterial({color:0x0e0e0e,roughness:0.3}),
  knob:new THREE.MeshStandardMaterial({color:0xf29a12,roughness:0.4})
};
const P={};
let mixer=null;const acts=[];const FPS=24;
function setF(f){if(!mixer)return;for(const a of acts)a.time=Math.max(0,(f-1)/FPS);mixer.update(0);}
new GLTFLoader().load('./knot_device.glb',g=>{
  const seen=new Set(),keep=['W_body','W_pin','W_slider_knob','A_cord1','A_cord2','A_knot_ball','A_card_in','A_card_out','A_card_out_rim'];
  g.scene.traverse(o=>{
    if(!o.isMesh)return;
    const nm=o.name.replace(/_\d+$/,'');
    if(!keep.includes(nm)||seen.has(nm)){o.visible=false;return;}
    seen.add(nm);const k=nm.slice(2);
    o.castShadow=true;o.receiveShadow=true;
    if(k==='body'){const c=o.geometry.getAttribute('color');o.geometry.setAttribute('ledMask',c);o.geometry.deleteAttribute('color');o.material=bodyMat;}
    else if(k.startsWith('cord')||k==='knot_ball')o.material=M.cord;
    else if(k.endsWith('rim'))o.material=M.rim;
    else if(k.startsWith('card'))o.material=M.card;
    else if(k==='pin')o.material=M.pin;else if(k==='slider_knob')o.material=M.knob;
    P[k]=o;
  });
  scene.add(g.scene);
  mixer=new THREE.AnimationMixer(g.scene);
  for(const c of g.animations){const a=mixer.clipAction(c);a.setLoop(THREE.LoopOnce);a.clampWhenFinished=true;a.play();a.paused=true;acts.push(a);}
  P.card_in.userData.x0=P.card_in.position.x;
  setScene();
},undefined,e=>console.error(e));

/* ---------- 상태 ---------- */
const S={card:false,paused:false,ended:false,hung:false,talks:0};
const anims=[];
function tween(dur,fn,done){anims.push({t0:performance.now(),dur,fn,done});}
function fade(o,to,dur=500){if(!o)return;const ms=o.material;const from=o.visible?ms.opacity:0;if(to>0)o.traverse(c=>{c.visible=true;});tween(dur,k=>{ms.opacity=from+(to-from)*k;o.traverse(c=>{if(c!==o&&c.material)c.material.opacity=ms.opacity;});},()=>{if(to===0)o.visible=false;});}
function slideX(o,from,to,dur=700){if(!o)return;o.visible=true;o.position.x=from;tween(dur,k=>{o.position.x=from+(to-from)*k;});}
function setScene(){setF(1);if(P.card_in){P.card_in.visible=false;P.card_in.position.x=P.card_in.userData.x0;}}
function playF(f0,f1,ms,done){tween(ms,k=>setF(f0+(f1-f0)*k),done);}
function ledOn(v){tween(700,k=>{U.uOn.value=v?k:1-k;});$('led').classList.toggle('on',v);$('led').querySelector('span').textContent=v?'AI가 답하는 중':'대기 중';}

/* ---------- 화면 ---------- */
const body=$('body');
const chat=[['me','카드 꽂으면 프로젝트 폴더가 생기게 하자'],['ai','좋아요. 카드 한 장이 폴더 하나예요. 이 폴더 안에서만 대화와 기억이 쌓여요.'],['me','끝낼 땐 줄 두 개를 묶는 걸로'],['ai','묶으면 카드에 구멍이 뚫려 나오고 폴더는 닫혀요. 다시 열 수는 없고 기록만 남아요.']];
function bar(pill,cls,name,st){const p=$('pill');p.textContent=pill;p.className='pill '+(cls||'');$('pname').textContent=name||'';$('st').textContent=st||'';}
function renderChat(n,typing){body.innerHTML=chat.slice(0,n).map(([w,t])=>`<p class="msg ${w}">${t}</p>`).join('')+(typing?'<p class="msg ai"><span class="typing"><b></b><b></b><b></b></span></p>':'');body.scrollTop=body.scrollHeight;}
const flow=[['m','TUI 과제 시작','10월'],['d','쌓이는 컨텍스트 오브제','크레슬링 접기까지 갔다가 안 접혀서 폐기'],['d','맞장구 오브제','억지스러워서 접음'],['m','프로젝트를 끝내는 행위','11월 23일'],['d','줄 하나로 매듭','두 줄로 바꿈'],['m','두 줄을 떼어 묶기',''],['m','카드 한 장이 폴더 하나',''],['m','뚫린 카드는 걸어서 보기만','지금']];
function drawMap(){
  body.innerHTML='<ol class="flow">'+flow.map(([k,t,n])=>`<li class="${k}"><b>${t}</b>${n?`<small>${n}</small>`:''}</li>`).join('')+'</ol><div class="legend"><span>이어진 결정</span><span class="d">버린 갈래</span></div>';
}

/* ---------- 버튼 ---------- */
const B=['bInsert','bTalk','bSlide','bKnot','bHang','bReset'].reduce((a,k)=>(a[k]=$(k),a),{});
function refresh(){B.bInsert.disabled=S.card&&!S.paused||S.ended&&!S.hung&&false;B.bInsert.textContent=S.paused?'카드 다시 꽂기':'카드 꽂기';
  B.bInsert.disabled=(S.card&&!S.paused)||S.ended;B.bTalk.disabled=!S.card||S.paused||S.ended;B.bSlide.disabled=!S.card||S.paused||S.ended;B.bKnot.disabled=!S.card||S.paused||S.ended;B.bHang.disabled=!S.ended||S.hung;
  for(const k in B)B[k].classList.remove('go');const nx=[B.bInsert,B.bTalk,B.bKnot,B.bHang].find(b=>!b.disabled);if(nx)nx.classList.add('go');}
B.bInsert.onclick=()=>{S.card=true;S.paused=false;{const o=P.card_in,x0=o.userData.x0;o.visible=true;tween(800,k=>{o.position.x=x0+0.08*(1-k);});}bar('폴더 열림','open','TUI 과제','진행 중');renderChat(S.talks*2);if(!S.talks)body.innerHTML='<div class="empty">새 프로젝트 폴더가 생겼어요<br>대화는 이 폴더 안에만 쌓여요</div>';refresh();};
B.bTalk.onclick=()=>{if(S.talks>=2){S.talks=1;}const n=S.talks*2+1;renderChat(n,true);ledOn(true);B.bTalk.disabled=true;
  setTimeout(()=>{renderChat(n+1);S.talks++;ledOn(false);refresh();},3200);};
B.bSlide.onclick=()=>{S.paused=true;const o=P.card_in,x0=o.userData.x0;tween(600,k=>{o.position.x=x0+0.05*k;});bar('일시정지','', 'TUI 과제','카드를 뺐어요. 폴더는 열린 채로 남아요');refresh();};
B.bKnot.onclick=()=>{S.ended=true;ledOn(false);B.bKnot.disabled=true;playF(1,110,4600);
  bar('폴더 닫힘','closed','TUI 과제','묶어서 끝냈어요. 카드에 구멍이 뚫렸어요');body.innerHTML='<div class="empty">이 프로젝트는 끝났어요<br>대화는 다시 열 수 없고 기록만 남아요</div>';refresh();};
B.bHang.onclick=()=>{S.hung=true;playF(130,200,3000,()=>{});
  bar('기록 보기','closed','TUI 과제','걸어둔 카드의 결정 흐름이에요. 보기만 할 수 있어요');setTimeout(drawMap,2600);refresh();};
B.bReset.onclick=()=>{Object.assign(S,{card:false,paused:false,ended:false,hung:false,talks:0});setScene();U.uOn.value=0;$('led').classList.remove('on');bar('카드 없음','','','카드를 꽂으면 프로젝트가 시작돼요');body.innerHTML='<div class="empty">슬롯에 카드를 꽂아 주세요</div>';refresh();};
refresh();

/* ---------- 루프 ---------- */
function size(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(size).observe(view);size();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0=performance.now();
renderer.setAnimationLoop(()=>{const now=performance.now();U.uTime.value=reduce?0:(now-t0)/1000;
  for(let i=anims.length-1;i>=0;i--){const a=anims[i];let k=Math.min(1,(now-a.t0)/a.dur);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;a.fn(k);if(k>=1){anims.splice(i,1);a.done&&a.done();}}
  ctl.update();renderer.render(scene,cam);});
}
</script>
</body>
</html>
