<style>
/* 책상 위 오브제가 주인공. 노트북 화면은 옆에 작게 놓인 보조 화면.
   호박색은 LED가 켜질 때와 이어진 결정에만 쓴다. 장식으로 쓰지 않는다. */
:root{color-scheme:dark light;
--page:light-dark(#e9e7e2,#151412);--stage:light-dark(#f6f5f1,#1e1d1a);--floor:light-dark(#dedbd3,#2a2824);
--ink:light-dark(#1a1916,#ebe7de);--mute:light-dark(#6e6a61,#8c877c);--line:light-dark(#d3cfc6,#33312c);
--amber:#f2a114;--glass:light-dark(#ffffff,#22211e);--bezel:light-dark(#2a2926,#0d0d0c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
header{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:28px max(4vw,16px) 18px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 580px;gap:0;margin:0 max(4vw,16px);border-radius:28px;overflow:hidden;background:var(--stage)}
.view{position:relative;min-height:min(72vh,720px);background:radial-gradient(ellipse 60% 38% at 46% 82%,var(--floor),transparent 70%)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.view canvas:active{cursor:grabbing}
.state{position:absolute;left:28px;top:24px;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.state i{width:22px;height:4px;border-radius:2px;background:var(--line);transition:background .5s,box-shadow .5s}
.state.on i{background:var(--amber);box-shadow:0 0 14px var(--amber)}
.state.on{color:var(--ink)}
.hint{position:absolute;left:28px;bottom:22px;color:var(--mute);font-size:13px}
.side{display:flex;align-items:center;padding:24px 24px 24px 0}
.laptop{width:100%;padding:0 4%}
.lid{position:relative;background:var(--bezel);border-radius:18px 18px 6px 6px;padding:20px 12px 14px;box-shadow:inset 0 0 0 1px #34322d}
.lid::before{content:"";position:absolute;top:8px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#2c2b28;box-shadow:inset 0 0 0 1px #45433d}
.base{position:relative;height:14px;margin:0 -7%;border-radius:2px 2px 14px 14px/2px 2px 12px 12px;background:linear-gradient(#55534d,#2d2c29 45%,#1b1a18);box-shadow:0 18px 28px -14px #000}
.base::before{content:"";position:absolute;top:0;left:50%;width:16%;height:5px;transform:translateX(-50%);border-radius:0 0 7px 7px;background:#1f1e1b}
.scr{display:grid;grid-template-columns:136px minmax(0,1fr);aspect-ratio:16/10.4;border-radius:4px;background:var(--glass);overflow:hidden}
.scr.wide{grid-template-columns:0 minmax(0,1fr)}.scr.wide .nav{visibility:hidden;padding:0;border:0}
.nav{border-right:1px solid var(--line);padding:12px 8px;overflow:auto;font-size:12px}
.nav h4{margin:0 6px 6px;font-size:11px;font-weight:500;color:var(--mute)}
.pj{display:flex;justify-content:space-between;gap:4px;padding:6px 8px;border-radius:8px;color:var(--mute)}
.pj b{font-weight:500;color:var(--ink)}
.pj.cur{background:var(--page)}
.pj em{font-style:normal;font-size:11px}
.pj em.open{color:var(--amber)}
#sess{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.ss{padding:5px 8px;border-radius:8px;color:var(--ink);line-height:1.35}
.ss small{display:block;color:var(--mute);font-size:10.5px}
.ss.cur{background:var(--page)}
.ss.dead{color:var(--mute);text-decoration:line-through}
.ss.k1{margin-left:10px}
.main{display:flex;flex-direction:column;min-height:0}
.fork{font-size:12px;color:var(--mute);margin:0 0 12px;padding-left:10px;border-left:2px solid var(--amber)}
.dec{font-size:12px;margin:4px 0 12px;color:var(--amber)}
.note2{font-size:12px;color:var(--mute);margin:0 0 12px}
.graph{position:absolute;inset:0;padding:8px 10px}
.graph svg{width:100%;height:100%;overflow:visible}
.cap{min-height:24px;margin:14px max(4vw,16px) 0;color:var(--ink);font-size:15px}
.gap{flex:1}
.flowb{border-color:var(--amber);color:var(--amber)}

.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.pill{padding:2px 10px;border-radius:12px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.open{border-color:var(--amber);color:var(--amber)}
.pill.closed{background:var(--ink);color:var(--glass);border-color:var(--ink)}
.bar .name{font-weight:600}
.sub{padding:6px 14px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);min-height:29px}
.body{flex:1;position:relative;overflow:auto;padding:14px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px}
.msg{max-width:88%;margin:0 0 10px;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5}
.me{margin-left:auto;background:var(--page)}
.ai{border:1px solid var(--line)}
.typing{display:inline-flex;gap:4px}.typing b{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:t 1s infinite}.typing b:nth-child(2){animation-delay:.15s}.typing b:nth-child(3){animation-delay:.3s}
@keyframes t{50%{opacity:.25}}
.flow{list-style:none;margin:0;padding:4px 0 4px 6px;position:relative}
.flow::before{content:"";position:absolute;left:10px;top:12px;bottom:26px;width:2px;background:var(--amber)}
.flow li{position:relative;padding:0 0 12px 22px;font-size:13px;line-height:1.4}
.flow li::before{content:"";position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.flow li.d{margin-left:24px;color:var(--mute)}
.flow li.d::before{background:var(--glass);border:1.5px solid var(--mute);width:8px;height:8px}
.flow li.d::after{content:"";position:absolute;left:-19px;top:10px;width:19px;height:0;border-top:1.5px dashed var(--mute)}
.flow li.d b{font-weight:500}
.flow small{display:block;color:var(--mute);font-size:12px}
.map{position:absolute;inset:0;padding:6px 8px 26px}
.map svg{width:100%;height:100%}
.legend{margin:6px 0 0 6px;font-size:11px;color:var(--mute);display:flex;gap:12px}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle;background:var(--amber)}
.legend span.d::before{background:var(--mute)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:18px max(4vw,16px) 6px}
button{font:500 15px "IBM Plex Sans KR",sans-serif;min-height:46px;padding:0 20px;border-radius:23px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
button:hover:not(:disabled){border-color:var(--mute)}
button.go{background:var(--ink);color:var(--page);border-color:var(--ink)}
button:disabled{color:var(--mute);opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#bReset{border-color:transparent;color:var(--mute)}
.note{padding:4px max(4vw,16px) 28px;color:var(--mute);font-size:12px}
@media(max-width:960px){.stage{grid-template-columns:minmax(0,1fr)}.scr{grid-template-columns:110px minmax(0,1fr)}.side{padding:0 16px 16px}.view{min-height:56vh}h1{font-size:44px}#bReset{margin-left:0}}
@media(prefers-reduced-motion:reduce){.typing b{animation:none}.state i{transition:none}}
</style>

<body>
<header><h1>knot.</h1><p>줄을 묶어 AI와 한 일을 끝내고 돌아보는 디바이스</p></header>
<main class="stage">
  <div class="view" id="view"><canvas id="c" aria-label="knot 디바이스 3D 모델"></canvas><div class="state" id="led"><i></i><span>대기 중</span></div><div class="hint">드래그해서 돌려보기, 스크롤해서 확대</div></div>
  <div class="side"><div class="laptop"><div class="lid"><div class="scr" id="scr">
    <aside class="nav"><div id="projs"></div><div id="sess"></div></aside>
    <section class="main"><div class="bar"><span class="pill" id="pill">카드 없음</span><span class="name" id="pname"></span></div>
    <div class="sub" id="st">카드를 꽂으면 그 프로젝트 폴더가 열려요</div>
    <div class="body" id="body"><div class="empty">슬롯에 카드를 꽂아 주세요</div></div></section>
  </div></div><div class="base"></div></div></div>
</main>
<p class="cap" id="cap" aria-live="polite"></p>
<nav class="controls" aria-label="디바이스 동작">
  <button id="bTui">TUI 과제 카드 꽂기</button>
  <button id="bPf">포트폴리오 카드 꽂기</button>
  <button id="bTalk">말 걸기</button>
  <button id="bNew">새 세션</button>
  <button id="bSlide">슬라이더로 빼기</button>
  <button id="bKnot">줄 묶기</button>
  <button id="bHang">뚫린 카드 걸기</button>
  <span class="gap"></span>
  <button id="bFlow" class="flowb">흐름 쭉 보기</button>
  <button id="bReset">처음으로</button>
</nav>
<p class="note">대화 내용은 이 과제를 진행하며 실제로 있었던 흐름을 예시로 줄여 넣었어요.</p>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
{
const $=id=>document.getElementById(id);
const view=$('view'),canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.55;
const cam=new THREE.PerspectiveCamera(32,1,0.01,10);
cam.position.set(0.44,0.25,0.38);
const ctl=new OrbitControls(cam,canvas);ctl.target.set(0.03,0.095,0);ctl.enableDamping=true;ctl.minDistance=0.25;ctl.maxDistance=1.6;ctl.maxPolarAngle=Math.PI*0.49;
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(0.1,0.6,0.9);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-0.4,right:0.4,top:0.4,bottom:-0.4,near:0.1,far:3});key.shadow.radius=3;key.shadow.bias=-0.0004;
scene.add(key);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,0.45));const rim=new THREE.DirectionalLight(0xfff3e0,1.6);rim.position.set(-0.5,0.45,-0.7);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4,4),new THREE.ShadowMaterial({opacity:0.32}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const U={uTime:{value:0},uOn:{value:0}};
const noise=`
float h3(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}`;
const bodyMat=new THREE.MeshPhysicalMaterial({color:0x0b0b0c,roughness:0.32,clearcoat:0.25,clearcoatRoughness:0.08});
bodyMat.onBeforeCompile=s=>{
  Object.assign(s.uniforms,U);
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 ledMask;varying float vMask;varying vec3 vObj;')
   .replace('#include <begin_vertex>','#include <begin_vertex>\nvMask=ledMask.r;vObj=position;');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform float uTime;uniform float uOn;varying float vMask;varying vec3 vObj;'+noise)
   .replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.22,0.17,0.09),vMask);')
   .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
   float t=uTime;float n=vn(vObj*9.0+vec3(t*0.35,-t*0.22,t*0.3));
   float sh=mix(0.35,1.0,smoothstep(0.3,0.7,n))*(0.85+0.15*sin(t*0.8));
   totalEmissiveRadiance+=vec3(1.0,0.45,0.0)*vMask*uOn*sh*1.8;`);
};
const M={
  cord:new THREE.MeshStandardMaterial({color:0x121212,roughness:0.8}),
  card:new THREE.MeshStandardMaterial({color:0x1c1c1e,roughness:0.75}),
  rim:new THREE.MeshStandardMaterial({color:0x8a8a8a,roughness:0.5,transparent:true}),
  pin:new THREE.MeshStandardMaterial({color:0x0e0e0e,roughness:0.3}),
  knob:new THREE.MeshStandardMaterial({color:0xf29a12,roughness:0.4})
};
const P={};
let mixer=null;const acts=[];const FPS=24;
function setF(f){if(!mixer)return;for(const a of acts)a.time=Math.max(0,(f-1)/FPS);mixer.update(0);}
new GLTFLoader().load('./knot_device.glb',g=>{
  const seen=new Set(),keep=['W_body','W_pin','W_slider_knob','A_cord1','A_cord2','A_knot_ball','A_card_in','A_card_out','A_card_out_rim'];
  g.scene.traverse(o=>{
    if(!o.isMesh)return;
    const nm=o.name.replace(/_\d+$/,'');
    if(!keep.includes(nm)||seen.has(nm)){o.visible=false;return;}
    seen.add(nm);const k=nm.slice(2);
    o.castShadow=true;o.receiveShadow=true;
    if(k==='body'){const c=o.geometry.getAttribute('color');o.geometry.setAttribute('ledMask',c);o.geometry.deleteAttribute('color');o.material=bodyMat;}
    else if(k.startsWith('cord')||k==='knot_ball')o.material=M.cord;
    else if(k.endsWith('rim'))o.material=M.rim;
    else if(k.startsWith('card'))o.material=M.card;
    else if(k==='pin')o.material=M.pin;else if(k==='slider_knob')o.material=M.knob;
    P[k]=o;
  });
  scene.add(g.scene);
  mixer=new THREE.AnimationMixer(g.scene);
  for(const c of g.animations){const a=mixer.clipAction(c);a.setLoop(THREE.LoopOnce);a.clampWhenFinished=true;a.play();a.paused=true;acts.push(a);}
  P.card_in.userData.x0=P.card_in.position.x;P.card_in.material=M.card.clone();
  setScene();
},undefined,e=>console.error(e));

/* ---------- 연출 도구 ---------- */
const anims=[];
function tween(dur,fn,done){anims.push({t0:performance.now(),dur,fn,done});}
function setScene(){setF(1);if(P.card_in){P.card_in.visible=false;P.card_in.position.x=P.card_in.userData.x0;}}
function playF(f0,f1,ms,done){tween(ms,k=>setF(f0+(f1-f0)*k),done);}
function ledOn(v){tween(700,k=>{U.uOn.value=v?k:1-k;});$('led').classList.toggle('on',v);$('led').querySelector('span').textContent=v?'AI가 답하는 중':'대기 중';}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 프로젝트와 세션 ---------- */
const DATA={
 tui:{name:'TUI 과제',color:0x1c1c1e,sessions:[
  {id:'s1',title:'형태 탐색',parent:null,ex:[['노트북 옆에 둘 오브제 형태 같이 보자','접히는 구조면 쌓인 맥락을 높이로 보여줄 수 있어요. 크레슬링 접기는 어때요?'],['좋아, 크레슬링으로 가자','크레슬링 접기로 정리해둘게요.']],decision:'크레슬링 접기로 간다'},
  {id:'s2',title:'인터랙션',parent:'s1',ex:[['크레슬링 윗면을 누르면 압축되게 하자','누르면 접히면서 카드가 나오는 흐름으로 정리할게요.']],decision:'누르면 접힌다'},
  {id:'s3',title:'방향 전환',parent:'s1',ex:[['종이로 접어봤는데 실제로 안 접혀. 크레슬링 버리자','그럼 형태 대신 끝내는 행위를 다뤄볼까요? 줄을 묶으면 프로젝트가 끝나는 식으로요.'],['좋다. 줄 두 개를 묶는 걸로','줄을 묶어서 끝내는 걸로 정리할게요. 인터랙션 세션의 누르기 안은 접을게요.']],decision:'줄을 묶어서 끝낸다',kills:'s2'}]},
 pf:{name:'포트폴리오',color:0xc9c6be,sessions:[
  {id:'p1',title:'첫 장 구성',parent:null,ex:[['포트폴리오 첫 장 뭐로 할지 고민돼','가장 자신 있는 작업 하나를 크게 여는 게 좋아요. 후보 작업을 알려주세요.']],decision:'대표작 하나로 연다'}]}};
let G;
function fresh(){G={slot:null,view:null,ended:null,hung:false,busy:false,log:[],
  st:{tui:'idle',pf:'idle'},cur:{tui:null,pf:null},
  ss:{}};for(const p in DATA)for(const x of DATA[p].sessions)G.ss[x.id]={step:0,started:false,dead:false,done:false};}
fresh();
const sess=id=>{for(const p in DATA)for(const x of DATA[p].sessions)if(x.id===id)return x;};
const nextSess=p=>DATA[p].sessions.find(x=>!G.ss[x.id].started);
const STW={idle:'',open:'열림',paused:'멈춤',closed:'닫힘'};

/* ---------- 화면 ---------- */
const body=$('body');
function bar(pill,cls,name,st){const p=$('pill');p.textContent=pill;p.className='pill '+(cls||'');$('pname').textContent=name||'';$('st').textContent=st||'';}
function drawNav(){
  $('projs').innerHTML='<h4>프로젝트</h4>'+Object.keys(DATA).map(p=>`<div class="pj${G.view===p?' cur':''}"><b>${DATA[p].name}</b><em class="${G.st[p]}">${STW[G.st[p]]}</em></div>`).join('');
  const p=G.view;
  if(!p){$('sess').innerHTML='';return;}
  const list=DATA[p].sessions.filter(x=>G.ss[x.id].started);
  $('sess').innerHTML='<h4>세션</h4>'+(list.length?list.map(x=>`<div class="ss${G.cur[p]===x.id?' cur':''}${G.ss[x.id].dead?' dead':''}${x.parent?' k1':''}">${x.title}${x.parent?`<small>${sess(x.parent).title}에서 갈라짐</small>`:''}</div>`).join(''):'<div class="ss" style="color:var(--mute)">아직 없음</div>');
}
function drawChat(typing){
  const p=G.view,id=G.cur[p];
  if(!id){body.innerHTML=`<div class="empty">${DATA[p].name} 폴더예요<br>말을 걸면 첫 세션이 시작돼요</div>`;return;}
  const x=sess(id),s=G.ss[id];let h='';
  if(x.parent)h+=`<p class="fork">${sess(x.parent).title}의 "${sess(x.parent).decision}"에서 갈라져 나온 세션</p>`;
  if(p==='pf')h+='<p class="note2">이 폴더에는 TUI 과제 대화가 들어오지 않아요</p>';
  for(let i=0;i<s.step;i++)h+=`<p class="msg me">${x.ex[i][0]}</p><p class="msg ai">${x.ex[i][1]}</p>`;
  if(typing)h+=`<p class="msg me">${x.ex[s.step][0]}</p><p class="msg ai"><span class="typing"><b></b><b></b><b></b></span></p>`;
  if(s.done)h+=`<p class="dec">결정: ${x.decision}</p>`;
  body.innerHTML=h;body.scrollTop=body.scrollHeight;
}
function drawGraph(p){
  const evs=G.log.filter(e=>e.p===p),dead=id=>!!(id&&G.ss[id].dead);
  const root={label:DATA[p].name,sub:'카드를 꽂음',kind:'root',kids:[]},by={};
  for(const e of evs){const x=sess(e.id);
    if(e.t==='start'){const n={label:x.title,kind:'s',id:e.id,kids:[]};by[e.id]=n;(x.parent?by[x.parent]:root).kids.push(n);}
    else by[e.id].dec=x.decision;}
  if(G.ended===p){const last=evs.filter(e=>!dead(e.id)).pop();(last?by[last.id]:root).kids.push({label:'줄을 묶어서 끝냄',sub:'카드에 구멍이 뚫림',kind:'end',kids:[]});}
  // 살아 있는 갈래가 줄기, 버린 갈래는 위아래로 번갈아 뻗음
  const all=[];let side=0;
  const place=(n,d,row)=>{n.d=d;n.row=row;all.push(n);
    const main=[...n.kids].reverse().find(k=>!dead(k.id))||null;
    for(const k of n.kids){if(k===main)continue;side++;place(k,d+1,row+(side%2?1:-1)*Math.ceil(side/2));}
    if(main)place(main,d+1,row);};
  place(root,0,0);
  const maxD=Math.max(...all.map(n=>n.d)),minR=Math.min(...all.map(n=>n.row)),maxR=Math.max(...all.map(n=>n.row));
  body.innerHTML='<div class="graph"><svg id="gsv"></svg></div>';
  const sv=$('gsv');
  const wrap=(t,n)=>{const w=t.split(' '),o=[];let c='';for(const k of w){if(c&&(c+' '+k).length>n){o.push(c);c=k;}else c=c?c+' '+k:k;}if(c)o.push(c);return o;};
  const draw=()=>{
    const W=sv.clientWidth,H=sv.clientHeight,cw=(W-40)/(maxD+0.75),X=n=>16+n.d*cw;
    const rows=maxR-minR,rh=rows?Math.min(120,(H-90)/rows):0,top=rows?Math.max(30,(H-rows*rh-60)/2):H*0.32,Y=n=>top+(n.row-minR)*rh;
    const fs=12,mc=Math.max(4,Math.floor((cw*0.6)/(fs*0.95)));
    let e='',t='';
    const walk=n=>{for(const k of n.kids){const x1=X(n),y1=Y(n),x2=X(k),y2=Y(k),dk=dead(k.id),col=dk?'var(--mute)':'var(--amber)',dash=dk?' stroke-dasharray="4 4"':'';
        e+=y1===y2?`<path d="M${x1} ${y1}H${x2}" style="stroke:${col}" stroke-width="2.5"${dash} fill="none"/>`
          :`<path d="M${x1+cw*0.66} ${y1}C${x1+cw*0.9} ${y1},${x1+cw*0.8} ${y2},${x2} ${y2}" style="stroke:${col}" stroke-width="2"${dash} fill="none"/>`;
        walk(k);}};
    walk(root);
    for(const n of all){const cx=X(n),cy=Y(n),dn=dead(n.id),col=dn?'var(--mute)':'var(--amber)',tc=dn?'var(--mute)':'var(--ink)',lt=dn?'text-decoration="line-through"':'';
      t+=n.kind==='end'?`<rect x="${cx-11}" y="${cy-5}" width="22" height="10" rx="5" style="fill:var(--ink)"/>`
        :n.kind==='root'?`<circle cx="${cx}" cy="${cy}" r="7" style="fill:var(--ink)"/>`
        :n.dec?`<rect x="${cx-6.5}" y="${cy-6.5}" width="13" height="13" transform="rotate(45 ${cx} ${cy})" style="fill:${col}"/>`
        :`<circle cx="${cx}" cy="${cy}" r="5.5" style="fill:var(--glass);stroke:${col}" stroke-width="2"/>`;
      t+=`<text x="${cx-6}" y="${cy-14}" font-size="${fs}" font-weight="500" style="fill:${tc}" ${lt}>${n.label}</text>`;
      const sub=n.dec||n.sub;
      if(sub){const L=wrap(sub,mc),c2=n.dec?(dn?'var(--mute)':'var(--amber)'):'var(--mute)';
        t+=`<text y="${cy+24}" font-size="${n.dec?fs:10.5}" style="fill:${c2}" ${lt}>${L.map((l,i)=>`<tspan x="${cx-6}" dy="${i?fs*1.3:0}">${l}</tspan>`).join('')}</text>`;}
      if(dn)t+=`<text x="${cx+12}" y="${cy+4}" font-size="11" style="fill:var(--mute)">내가 버림</text>`;
    }
    sv.innerHTML=e+t;
  };
  draw();new ResizeObserver(draw).observe(sv);
}
function render(typing){drawNav();$('scr').classList.toggle('wide',!!(G.hung&&G.view===G.ended));
  if(G.hung&&G.view===G.ended){bar('기록 보기','closed',DATA[G.view].name,'내가 고르고 버린 길이에요. AI는 더 이상 이걸 쓰지 않아요');drawGraph(G.view);return;}
  if(!G.view){bar('카드 없음','','','카드를 꽂으면 그 프로젝트 폴더가 열려요');body.innerHTML='<div class="empty">슬롯에 카드를 꽂아 주세요</div>';return;}
  const p=G.view,st=G.st[p];
  if(st==='closed'){bar('닫힘','closed',DATA[p].name,'묶어서 끝냈어요. AI는 이 맥락을 더 쓰지 않아요');body.innerHTML='<div class="empty">이 프로젝트는 끝났어요<br>뚫린 카드를 걸면 갈래를 볼 수 있어요</div>';return;}
  bar(st==='open'?'열림':'멈춤',st==='open'?'open':'',DATA[p].name,st==='open'?(G.cur[p]?`${sess(G.cur[p]).title} 세션`:'새 폴더'):'카드를 뺐어요. 폴더는 그대로 남아 있어요');
  drawChat(typing);
}

/* ---------- 동작 ---------- */
async function insert(p){
  G.slot=p;G.view=p;G.st[p]='open';
  const o=P.card_in,x0=o.userData.x0;o.material.color.setHex(DATA[p].color);o.visible=true;
  tween(800,k=>{o.position.x=x0+0.08*(1-k);});render();refresh();await wait(900);
}
async function talk(){
  const p=G.slot;if(!G.cur[p]){const n=nextSess(p);startSess(p,n);}
  const id=G.cur[p],s=G.ss[id],x=sess(id);
  G.busy=true;refresh();render(true);ledOn(true);await wait(2600);ledOn(false);
  s.step++;if(s.step>=x.ex.length){s.done=true;G.log.push({p,id,t:'dec'});if(x.kills)G.ss[x.kills].dead=true;}
  G.busy=false;render();refresh();await wait(500);
}
function startSess(p,x){G.ss[x.id].started=true;G.cur[p]=x.id;G.log.push({p,id:x.id,t:'start'});}
async function newSess(){const p=G.slot;startSess(p,nextSess(p));render();refresh();await wait(700);}
async function slide(){
  const p=G.slot;G.st[p]='paused';G.slot=null;
  const o=P.card_in,x0=o.userData.x0;tween(600,k=>{o.position.x=x0+0.05*k;});render();refresh();await wait(1300);
  o.visible=false;
}
async function knot(){
  const p=G.slot;G.ended=p;G.st[p]='closed';G.slot=null;G.busy=true;refresh();
  P.card_out.material=M.card.clone();P.card_out.material.color.setHex(DATA[p].color);
  playF(1,110,4600,()=>{G.busy=false;refresh();});render();await wait(4900);
}
async function hang(){G.hung=true;G.view=G.ended;G.busy=true;refresh();playF(130,200,3000,()=>{G.busy=false;render();refresh();});await wait(3300);}

/* ---------- 버튼 ---------- */
const B=['bTui','bPf','bTalk','bNew','bSlide','bKnot','bHang','bFlow','bReset'].reduce((a,k)=>(a[k]=$(k),a),{});
let auto=false;
function can(){const p=G.slot,c=p&&G.cur[p],s=c&&G.ss[c],x=c&&sess(c);
  return{bTui:!G.slot&&G.st.tui!=='closed'&&!G.busy,bPf:!G.slot&&G.st.pf!=='closed'&&!G.busy,
    bTalk:!!p&&!G.busy&&(c?!s.done:!!nextSess(p)),bNew:!!p&&!G.busy&&!!c&&s.done&&!!nextSess(p),
    bSlide:!!p&&!G.busy,bKnot:!!p&&!G.busy&&G.log.some(e=>e.p===p&&e.t==='dec')&&!G.ended,bHang:!!G.ended&&!G.hung&&!G.busy&&!G.slot};}
function refresh(){const c=can();for(const k in c){B[k].disabled=auto||!c[k];}B.bFlow.disabled=auto;B.bFlow.textContent=auto?'재생 중':'흐름 쭉 보기';}
B.bTui.onclick=()=>insert('tui');B.bPf.onclick=()=>insert('pf');B.bTalk.onclick=talk;B.bNew.onclick=newSess;B.bSlide.onclick=slide;B.bKnot.onclick=knot;B.bHang.onclick=hang;
function reset(){fresh();setScene();U.uOn.value=0;$('led').classList.remove('on');$('cap').textContent='';render();refresh();}
B.bReset.onclick=()=>{auto=false;reset();};
B.bFlow.onclick=async()=>{
  reset();auto=true;refresh();const cap=t=>{$('cap').textContent=t;};
  const steps=[
   ['카드를 꽂으면 그 일의 기억이 시작돼요. 어디서부터인지 내가 정해요',()=>insert('tui')],
   ['첫 세션에서 형태를 정해요. AI가 답하는 동안 곡면이 일렁여요',async()=>{await talk();await talk();}],
   ['같은 프로젝트 안에서 새 세션을 열어요. 앞 세션의 결정에서 갈라져 나와요',async()=>{await newSess();await talk();}],
   ['다른 일을 하려면 슬라이더로 카드를 빼요. 폴더는 멈춘 채로 남아요',()=>slide()],
   ['포트폴리오 카드를 꽂아요. 이 폴더에는 TUI 이야기가 섞이지 않아요',async()=>{await insert('pf');await talk();}],
   ['다시 TUI 카드로 돌아와요. 세션들이 그대로 있어요',async()=>{await slide();await insert('tui');}],
   ['형태 탐색의 결정으로 돌아가 다른 갈래를 열어요. 앞의 인터랙션 갈래는 버려져요',async()=>{await newSess();await talk();await talk();}],
   ['줄을 묶어 끝내요. 이 맥락은 AI 기억에서 빠지고 카드에 구멍이 뚫려 나와요',()=>knot()],
   ['카드를 걸면 내가 고르고 버리고 방향을 튼 길이 펼쳐져요',()=>hang()]];
  for(const [t,f] of steps){if(!auto)return;cap(t);await f();await wait(700);}
  auto=false;refresh();
};
reset();

/* ---------- 루프 ---------- */
function size(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(size).observe(view);size();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0=performance.now();
renderer.setAnimationLoop(()=>{const now=performance.now();U.uTime.value=reduce?0:(now-t0)/1000;
  for(let i=anims.length-1;i>=0;i--){const a=anims[i];let k=Math.min(1,(now-a.t0)/a.dur);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;a.fn(k);if(k>=1){anims.splice(i,1);a.done&&a.done();}}
  ctl.update();renderer.render(scene,cam);});
}
</script>
