<style>
:root{color-scheme:light dark;
--page:light-dark(#e9e7e2,#151412);--stage:light-dark(#f6f5f1,#1e1d1a);
--ink:light-dark(#1a1916,#ebe7de);--mute:light-dark(#6e6a61,#8c877c);--line:light-dark(#d3cfc6,#33312c);
--amber:#f2a114;--glass:light-dark(#ffffff,#22211e)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:28px max(4vw,16px) 14px}
header h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.01em}
header p{margin:0;color:var(--mute)}
header a{margin-left:auto;color:var(--mute);font-size:14px}
.legend{display:flex;gap:22px;flex-wrap:wrap;padding:0 max(4vw,16px) 12px;color:var(--mute);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{flex:none}
.count{padding:0 max(4vw,16px) 14px;font-size:15px}
.count b{color:var(--amber);font-weight:600}
.mapwrap{margin:0 max(4vw,16px);border-radius:24px;background:var(--stage);overflow-x:auto;overflow-y:hidden}
svg#map{display:block}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .hit{stroke:var(--amber);stroke-width:2}
.detail{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;margin:18px max(4vw,16px) 48px;padding:26px 28px;border-radius:24px;background:var(--stage)}
.meta .date{color:var(--mute);font-size:13px}
.meta h2{margin:4px 0 10px;font-size:22px;font-weight:600}
.meta .who{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);color:var(--mute)}
.meta .who.me{border-color:var(--amber);color:var(--amber)}
.meta .dec{margin-top:14px;font-size:14px}
.meta .dec em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px;max-width:760px}
.b{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-line}
.b.u{align-self:flex-end;background:var(--amber);color:#1a1205;border-bottom-right-radius:4px}
.b.a{align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:4px}
.note{color:var(--mute);font-size:13px}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
