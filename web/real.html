<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>knot. 이번 학기 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--page:light-dark(#e9e7e2,#151412);--stage:light-dark(#f6f5f1,#1e1d1a);
--ink:light-dark(#1a1916,#ebe7de);--mute:light-dark(#6e6a61,#8c877c);--line:light-dark(#d3cfc6,#33312c);
--amber:#f2a114;--glass:light-dark(#ffffff,#22211e)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:28px max(4vw,16px) 14px}
header h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.01em}
header p{margin:0;color:var(--mute)}
header a{margin-left:auto;color:var(--mute);font-size:14px}
.legend{display:flex;gap:22px;flex-wrap:wrap;padding:0 max(4vw,16px) 12px;color:var(--mute);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{flex:none}
.count{padding:0 max(4vw,16px) 14px;font-size:15px}
.count b{color:var(--amber);font-weight:600}
.mapwrap{border-radius:24px;background:var(--stage);overflow-x:auto;overflow-y:hidden}
svg#map{display:block}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .hit{stroke:var(--amber);stroke-width:2}
.detail{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;margin:18px max(4vw,16px) 48px;padding:26px 28px;border-radius:24px;background:var(--stage)}
.meta .date{color:var(--mute);font-size:13px}
.meta h2{margin:4px 0 10px;font-size:22px;font-weight:600}
.meta .who{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);color:var(--mute)}
.meta .who.me{border-color:var(--amber);color:var(--amber)}
.meta .dec{margin-top:14px;font-size:14px}
.meta .dec em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px;max-width:760px}
.b{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-line}
.b.u{align-self:flex-end;background:var(--amber);color:#1a1205;border-bottom-right-radius:4px}
.b.a{align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:4px}
.note{color:var(--mute);font-size:13px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;margin:0 max(4vw,16px) 48px}
.side{background:var(--stage);border-radius:24px;padding:20px 14px;align-self:start;position:sticky;top:16px}
.proj{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:500;padding:4px 8px 12px}
.side ul{list-style:none;margin:0 0 0 18px;padding:0 0 0 12px;border-left:1px solid var(--line)}
.side li button{all:unset;box-sizing:border-box;display:block;width:100%;padding:9px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink)}
.side li button:hover{background:var(--page)}
.side li button.on{background:var(--page);box-shadow:inset 0 0 0 1px var(--line)}
.side li button:focus-visible{outline:2px solid var(--amber)}
.side li small{display:block;color:var(--mute);font-size:12px}
.main .mapwrap,.main .detail{margin-left:0;margin-right:0}
.main .detail{margin-bottom:0}
.node.dim{opacity:.16}
.thread.dim{opacity:.05!important}
.node:hover circle{filter:brightness(1.25)}
.edge.dim{opacity:.12}
.chathead{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin-bottom:-6px}
.chathead h2{margin:0;font-size:20px}
.sep{align-self:center;color:var(--mute);font-size:12px;margin:6px 0}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{id:'t11',s:'c5',p:'t10',date:'11월 24일',title:'knot.',who:'me',dec:'끝난 맥락은 닫고, 내가 한 판단은 돌아본다',

const HUE={c1:'#6fa3c7',c2:'#8fb46a',c3:'#c48fd0',c4:'#d6926a',c5:'#cbb25c'};
const trunk=[];(function walk(n){trunk.push(n);const nx=n.kids.find(k=>!k.dead);if(nx)walk(nx);})(by.t0);

const W=x+80;sv.setAttribute('width',W);sv.setAttribute('height',H);sv.setAttribute('viewBox',`0 0 ${W} ${H}`);
// branches fan out from a fork just after each trunk node
trunk.forEach((n,i)=>{const dk=n.kids.filter(c=>c.dead),nx=trunk[i+1];const span=nx?nx.px-n.px:260;
  dk.forEach((k,j)=>{const up=j%2===0,rank=Math.floor(j/2),cnt=Math.ceil(dk.length/2);
    const t=(rank+1)/(cnt+1);const fx=n.px+span*(0.18+0.5*t);const fy=n.py+(nx?(nx.py-n.py)*(0.18+0.5*t):0);
    const len=170+((rank%2)?80:0)+rank*30;const ang=(up?-1:1)*(0.95-0.08*rank);
    k.fx=fx;k.fy=fy;k.px=fx+Math.cos(ang)*len*0.7;k.py=fy+Math.sin(ang)*len;
    k.py=Math.max(70,Math.min(H-110,k.py));});});
const X=n=>n.px,Y=n=>n.py;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const wrap=(t,m)=>{const w=t.split(' '),o=[];let c='';for(const k of w){if(c&&(c+' '+k).length>m){o.push(c);c=k}else c=c?c+' '+k:k}if(c)o.push(c);return o};
let bg='',e='',th='',g='';
// chat regions: contiguous stretches of the trunk
{const segs=[];trunk.forEach((n,i)=>{const last=segs[segs.length-1];if(last&&last.s===n.s)last.to=i;else segs.push({s:n.s,from:i,to:i});});
 segs.forEach((g,i)=>{const x0=trunk[g.from].px-90,nxt=segs[i+1],x1=nxt?trunk[nxt.from].px-100:W-20,c=CHATS.find(c=>c.id===g.s);
  bg+=`<rect x="${x0}" y="24" width="${x1-x0}" height="${H-48}" rx="28" fill="${HUE[g.s]}" opacity=".06"/><text x="${x0+22}" y="56" font-size="13" font-weight="600" fill="${HUE[g.s]}">${esc(c.t)}</text>`;});}
// trunk as smooth curve
let d=`M${trunk[0].px-60} ${trunk[0].py}`;trunk.forEach((n,i)=>{const p=trunk[i-1];if(!p){d+=` L${n.px} ${n.py}`;return;}const mx=(p.px+n.px)/2;d+=` C${mx} ${p.py},${mx} ${n.py},${n.px} ${n.py}`;});
